services:
  postgres:
    image: postgres:16-alpine
    container_name: riskyc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: riskyc
      POSTGRES_USER: riskyc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskyc}
    # Not published to the host — only the backend container needs it,
    # reached over the internal riskyc-net network below.
    volumes:
      - riskyc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskyc"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - riskyc-net

  minio:
    image: minio/minio:latest
    container_name: riskyc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"   # S3 API — must stay public, presigned URLs point here
      - "${MINIO_CONSOLE_PORT:-9003}:9001" # Web console
    volumes:
      - riskyc-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - riskyc-net

  backend:
    build: .
    image: riskyc-backend:latest
    container_name: riskyc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/riskyc
      DB_USERNAME: riskyc
      DB_PASSWORD: ${POSTGRES_PASSWORD:-riskyc}
      # Internal endpoint — fast, stays on the Docker network, used for the
      # backend's own upload/delete/stream calls to MinIO.
      MINIO_ENDPOINT: http://minio:9000
      # Public endpoint — the ONLY thing a browser can reach. Used solely to
      # sign presigned GET URLs so they resolve outside the Docker network.
      # Full URL (scheme + host, no assumed port) — set MINIO_PUBLIC_URL in
      # .env once you're behind nginx/HTTPS instead of raw IP:port. Compose
      # interpolation doesn't support nesting, so the fallback here is a
      # plain literal, not a computed PUBLIC_HOST/port combo.
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_URL:-http://167.86.120.214:9002}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: riskyc-media
      # Full URL of the frontend, for CORS — set FRONTEND_URL in .env once
      # you're behind a domain/HTTPS proxy instead of IP:port.
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://167.86.120.214:3001}
      JWT_SECRET: ${JWT_SECRET:-cmlza3ljLWZhc2hpb24tZGV2LW9ubHktand0LXNpZ25pbmcta2V5LWNoYW5nZS1pbi1wcm9k}
      # Same value as NEXT_PUBLIC_GOOGLE_CLIENT_ID in the frontend repo's .env.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${BACKEND_PORT:-8082}:8080"
    networks:
      - riskyc-net

volumes:
  riskyc-postgres-data:
  riskyc-minio-data:

networks:
  riskyc-net:
    name: riskyc-net
