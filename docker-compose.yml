services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riskyc
      POSTGRES_USER: riskyc
      POSTGRES_PASSWORD: riskyc
    ports:
      - "5432:5432"
    volumes:
      - riskyc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskyc"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - riskyc-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  riskyc-postgres-data:
  riskyc-minio-data:
