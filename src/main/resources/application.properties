spring.application.name=Riskyc
server.port=${SERVER_PORT:8080}

# ---- PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/riskyc}
spring.datasource.username=${DB_USERNAME:riskyc}
spring.datasource.password=${DB_PASSWORD:riskyc}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Collapses N+1 lazy-collection loads (product colors, product media, category
# subcategories, order items) into a handful of "WHERE id IN (...)" batches
# instead of one query per parent row.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ---- File uploads (product images/videos, payment screenshots) ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ---- MinIO (S3-compatible) object storage ----
app.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.region=${MINIO_REGION:us-east-1}
app.storage.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.storage.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.storage.bucket=${MINIO_BUCKET:riskyc-media}
# MinIO requires path-style bucket addressing (http://host:port/bucket/key)
app.storage.path-style-access=true
# Presigned URL lifetime returned to clients
app.storage.presigned-url-ttl-minutes=${MINIO_PRESIGNED_TTL_MINUTES:60}
# How long a presigned URL is kept in the server-side cache before being
# regenerated (kept slightly under the real TTL above so a cached URL is
# never handed out close to expiry)
app.storage.presigned-cache-ttl-minutes=${MINIO_PRESIGNED_CACHE_TTL_MINUTES:55}
# Base path prefix under which uploaded objects are grouped
app.storage.public-base-url=${MINIO_PUBLIC_BASE_URL:}

# ---- CORS: the Next.js storefront + admin panel ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---- Admin JWT ----
# Base64-encoded HMAC-SHA256 key. The default below is a fixed dev-only
# value so the app runs out of the box — override with a real secret
# (e.g. `openssl rand -base64 48`) via JWT_SECRET in any shared environment.
app.security.jwt.secret=${JWT_SECRET:cmlza3ljLWZhc2hpb24tZGV2LW9ubHktand0LXNpZ25pbmcta2V5LWNoYW5nZS1pbi1wcm9k}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# ---- Payment numbers shown to the customer at checkout ----
app.payment.orange-money-code=${PAYMENT_ORANGE_MONEY_CODE:693 45 67 89}
app.payment.mobile-money-code=${PAYMENT_MOBILE_MONEY_CODE:677 12 34 56}
# Free delivery threshold; below it a flat delivery fee is added
app.payment.free-delivery-threshold=${FREE_DELIVERY_THRESHOLD:50000}
app.payment.delivery-fee=${DELIVERY_FEE:2500}

logging.level.com.fashion.Riskyc=${LOG_LEVEL:INFO}

